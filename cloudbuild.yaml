steps:
- name: 'gcr.io/cloud-builders/docker'
  id: "build_sidecar_image_gen1"
  entrypoint: 'bash'
  args:
    - 'docker_build'
    - 'cloud_run_gen1'
    - '${_REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}'
    - '${_TAG_NAME}'
- name: 'gcr.io/cloud-builders/docker'
  id: "build_sidecar_image_gen2"
  entrypoint: 'bash'
  args:
    - 'docker_build'
    - 'cloud_run_gen2'
    - '${_REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}'
    - '${_TAG_NAME}'
tags: ['pcap-sidecar']
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
#   dynamicSubstitutions: true
# substitutions:
#   _REPO_LOCATION: "$REPO_LOCATION"
#   _REPO_NAME: "$REPO_NAME"
#   _IMAGE_NAME: "$IMAGE_NAME"
#   _TAG_NAME: "$TAG_NAME"
